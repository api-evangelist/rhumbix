name: Rhumbix
description: Rhumbix is a field-first workforce management platform for construction that consolidates timekeeping,
  production tracking, time & materials, change orders, daily field reports, and custom forms into real-time visibility
  on labor and job costs for trade contractors and general contractors. Rhumbix publishes a REST Public API (Swagger
  2.0, x-api-key auth) for batch import of employees and projects and batch export of workshift/timecard data, enabling
  bidirectional flow between the field and ERP/accounting and project-management systems (Sage, Oracle, SAP, QuickBooks,
  Viewpoint, CMiC, Procore, Autodesk Construction Cloud). Autodesk has signed a definitive agreement to acquire
  Rhumbix.
